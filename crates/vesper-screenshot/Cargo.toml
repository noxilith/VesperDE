[package]
name = "vesper-screenshot"
description = "Vesper region screenshot picker: drag a rectangle, then the compositor captures it"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vesper-ipc = { path = "../vesper-ipc" }
vesper-gfx = { path = "../vesper-gfx" }
vesper-config = { path = "../vesper-config" }
serde_json = "1"
rqrr = "0.10"
anyhow = "1"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
smithay-client-toolkit = "0.20"

[dev-dependencies]
qrcode = { version = "0.14", default-features = false }
