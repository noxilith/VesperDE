[package]
name = "vesper-power"
description = "Vesper power menu: lock, sleep, log out, restart, shut down (Mod+Shift+P or the power key)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vesper-config = { path = "../vesper-config" }
vesper-gfx = { path = "../vesper-gfx" }
vesper-ipc = { path = "../vesper-ipc" }
anyhow = "1"
serde_json = "1"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
smithay-client-toolkit = "0.20"
