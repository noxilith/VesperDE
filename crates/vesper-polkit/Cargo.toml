[package]
name = "vesper-polkit"
description = "Vesper polkit authentication agent: password dialog for pkexec and other admin prompts (layer-shell client)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vesper-config = { path = "../vesper-config" }
vesper-gfx = { path = "../vesper-gfx" }
anyhow = "1"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
smithay-client-toolkit = "0.20"
zbus = "5"
async-channel = "2"
libc = "0.2"
