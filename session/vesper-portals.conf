# Which portal backend handles which interface in a Vesper session.
# xdg-desktop-portal reads this because the session sets XDG_CURRENT_DESKTOP=Vesper (file name: vesper-portals.conf).
[preferred]
default=gtk
org.freedesktop.impl.portal.FileChooser=filemanager
# Screen sharing (browsers, Discord, OBS, Zoom): xdg-desktop-portal-wlr on top of the compositor's wlr-screencopy.
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
