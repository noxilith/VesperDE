[package]
name = "file-manager"
version = "0.6.3"
edition = "2024"
description = "File Manager for the Vesper desktop: a small, fast, keyboard-friendly file manager (fork of Ski)"
license = "MIT"
repository = "https://github.com/noxilith/VesperDE"

[dependencies]
dirs = "7.0.0"
# The defaults without "clipboard": egui's clipboard makes a Wayland data device of its own, and
# Hyprland sends drags only to a program's first one; wayland_dnd.rs carries the clipboard instead
# No "wgpu" either: File Manager draws with OpenGL (glow), and wgpu with naga and Vulkan is a quarter of the build
eframe = { version = "0.37.0", default-features = false, features = ["glow", "accesskit", "default_fonts", "links", "system_fonts", "wayland", "web_screen_reader", "x11"] }
# eframe's default "winit/default", which a feature list cannot name: loads the Wayland libraries at run time
winit = "0.30"
base64 = "0.22"
flate2 = "1.1.10"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff", "tga", "pnm", "qoi", "hdr", "dds"] }
libc = "0.2"
open = "5.4.4"
resvg = { version = "0.45", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = "0.4.46"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
hayro = "0.8.0"
arboard = "3.7"
wl-clipboard-rs = "0.9"
zbus = "5"
blocking = "1"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
wayland-client = "0.31"
raw-window-handle = "0.6"
x11-dl = "2.21"
ab_glyph = "0.2"
wayland-backend = { version = "0.3", features = ["client_system"] }
png = "0.18"
md5 = "0.7"
percent-encoding = "2"
notify = { version = "8", default-features = false }

# Thin LTO and 16 codegen units compile much faster than fat LTO in one unit, at about the same run-time speed
[profile.release]
lto = "thin"
codegen-units = 16

[profile.dev.package."*"]
opt-level = 3

