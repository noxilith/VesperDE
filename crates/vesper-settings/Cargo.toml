[package]
name = "vesper-settings"
description = "Vesper Settings: one window to configure displays, power, appearance, input, apps and more (Mod+,)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vesper-config = { path = "../vesper-config" }
vesper-gfx = { path = "../vesper-gfx" }
vesper-ipc = { path = "../vesper-ipc" }
vesper-apps = { path = "../vesper-apps" }
xcursor = "0.3"
anyhow = "1"
serde_json = "1"
toml.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
smithay-client-toolkit = "0.20"
