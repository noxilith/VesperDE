[package]
name = "vesper-bar"
description = "Vesper top bar: workspaces, focused window, clock (layer-shell client, no GTK)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vesper-config = { path = "../vesper-config" }
vesper-ipc = { path = "../vesper-ipc" }
vesper-gfx = { path = "../vesper-gfx" }
vesper-apps = { path = "../vesper-apps" }
serde_json = "1"
toml.workspace = true
anyhow = "1"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
smithay-client-toolkit = "0.20"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
zbus = "5"

[dev-dependencies]
png = "0.17"
